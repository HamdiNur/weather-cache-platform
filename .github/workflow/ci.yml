name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — install, migrate, boot check
    runs-on: ubuntu-latest

    # Spin up real Postgres + Redis containers for this job,
    # same as your local docker-compose setup.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weather_cache_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Apply database schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d weather_cache_platform -f backend/sql/schema.sql

      - name: Boot the server and check health endpoint
        working-directory: backend
        env:
          PORT: 5000
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: weather_cache_platform
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret_key
          JWT_EXPIRES_IN: 7d
          WEATHER_API_BASE_URL: https://api.open-meteo.com/v1/forecast
          GEOCODING_API_BASE_URL: https://geocoding-api.open-meteo.com/v1/search
          WEATHER_CACHE_TTL_SECONDS: 600
          CLIENT_URL: http://localhost:5173
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:5000/api/health
          kill $SERVER_PID

  frontend:
    name: Frontend — install and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build